services:
  - type: web
    name: learner-scaffolding-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: EMBEDDING_MODE
        value: api
      - key: EMBEDDING_PROVIDER
        value: voyage
      - key: EMBEDDING_MODEL
        value: voyage-4-lite
      - key: EMBEDDING_BASE_URL
        value: https://api.voyageai.com/v1
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_BATCH_SIZE
        value: 64
      - key: EMBEDDING_MAX_RETRIES
        value: 3
      - key: CHUNK_SIZE
        value: 1200
      - key: CHUNK_OVERLAP
        value: 180
      - key: TOP_K
        value: 5
